[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ─── Cache headers ────────────────────────────────────────────────────────────

# Hashed JS/CSS bundles — 1 year immutable (Vite content-hashes the filenames)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Icons — 1 week cache (rarely change)
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Apple touch icons & favicons — 1 week
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Splash screens — 1 week
[[headers]]
  for = "/splash/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Screenshots — 1 week
[[headers]]
  for = "/screenshots/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# OG image — 1 week
[[headers]]
  for = "/og-image.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Manifest — short cache (may change with app updates)
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Service worker — MUST NOT be cached (browser needs fresh copy to detect updates)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# places-data.json fallback — 1 day (large file, infrequent updates)
[[headers]]
  for = "/places-data.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# App shell HTML — always revalidate
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ─── Redirects ────────────────────────────────────────────────────────────────

# SPA fallback — all routes serve index.html (sw.js served as real file before this)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
