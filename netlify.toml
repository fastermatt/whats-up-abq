[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ─── Security headers ─────────────────────────────────────────────────────────
# Applied to all routes; specific cache rules below still override Cache-Control.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), payment=()"
    X-XSS-Protection = "1; mode=block"

# ─── Cache headers ────────────────────────────────────────────────────────────
# NOTE: In Netlify, later rules override earlier ones when both match.
# Order: catch-all first, specific overrides last.

# App shell HTML — always revalidate (catch-all, overridden by rules below)
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# places-data.json fallback — 1 day (large file, infrequent updates)
[[headers]]
  for = "/places-data.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Manifest — short cache (may change with app updates)
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Apple touch icons & favicons — 1 week
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Icons — 1 week cache (rarely change)
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Splash screens — 1 week
[[headers]]
  for = "/splash/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Screenshots — 1 week
[[headers]]
  for = "/screenshots/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# OG image — 1 week
[[headers]]
  for = "/og-image.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Service worker — MUST NOT be cached (browser needs fresh copy to detect updates)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Hashed JS/CSS bundles — 1 year immutable (Vite content-hashes the filenames)
# This must be last so it overrides the /* rule for /assets/*
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ─── Redirects ────────────────────────────────────────────────────────────────

# SPA fallback — all routes serve index.html (sw.js served as real file before this)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
