[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ─── Security headers ─────────────────────────────────────────────────────────
# Applied to all routes; specific cache rules below still override Cache-Control.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), payment=()"
    X-XSS-Protection = "1; mode=block"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.ticketmaster.com https://api.seatgeek.com https://rest.bandsintown.com; frame-src https://www.google.com https://maps.google.com; worker-src 'self'; frame-ancestors 'none';"

# ─── Cache headers ────────────────────────────────────────────────────────────
# NOTE: In Netlify, later rules override earlier ones when both match.
# Order: catch-all first, specific overrides last.

# App shell HTML — always revalidate (catch-all, overridden by rules below)
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# places-data.json fallback — 1 day (large file, infrequent updates)
[[headers]]
  for = "/places-data.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# events-og.json — 1 day (static event data for OG previews)
[[headers]]
  for = "/events-og.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# sitemap.xml — 1 day
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/xml"

# Manifest — short cache (may change with app updates)
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Apple touch icons & favicons — 1 week
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# WebP images — 1 week cache (same as PNG/SVG)
[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/icons/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/icons/vibes/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Icons — 1 week cache (rarely change)
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Splash screens — 1 week
[[headers]]
  for = "/splash/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Screenshots — 1 week
[[headers]]
  for = "/screenshots/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# OG image — 1 week
[[headers]]
  for = "/og-image.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Service worker — MUST NOT be cached (browser needs fresh copy to detect updates)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Hashed JS/CSS bundles — 1 year immutable (Vite content-hashes the filenames)
# This must be last so it overrides the /* rule for /assets/*
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ─── Edge Functions ───────────────────────────────────────────────────────────
# Dynamic OG meta tags for shared place/event links (social previews)

[[edge_functions]]
  function = "og"
  path = "/place/*"

[[edge_functions]]
  function = "og"
  path = "/event/*"

# ─── Redirects ────────────────────────────────────────────────────────────────

# HTTP → HTTPS force redirect (fixes bare http:// returning 404)
[[redirects]]
  from = "http://abqunplugged.com/*"
  to = "https://abqunplugged.com/:splat"
  status = 301
  force = true

# SPA fallback — all routes serve index.html (sw.js served as real file before this)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Event data JSON files — short CDN cache (refreshed weekly by pipeline)
[[headers]]
  for = "/data/*.json"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

# ─── Serverless Functions ─────────────────────────────────────────────────────
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

