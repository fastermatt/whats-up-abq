<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <circle cx="32" cy="32" r="28" fill="#f0eaff"/>
  <circle cx="32" cy="32" r="28" fill="none" stroke="#6c4ab6" stroke-width="3"/>
  <!-- guitar body -->
  <ellipse cx="30" cy="42" rx="10" ry="12" fill="#c8a96e" stroke="#8b6914" stroke-width="1.5"/>
  <!-- guitar waist -->
  <ellipse cx="30" cy="38" rx="7" ry="5" fill="#b8924a" stroke="#8b6914" stroke-width="1"/>
  <!-- soundhole -->
  <circle cx="30" cy="42" r="4" fill="#8b6914" opacity="0.4"/>
  <!-- neck -->
  <rect x="27.5" y="18" width="5" height="22" rx="2.5" fill="#c8a96e" stroke="#8b6914" stroke-width="1.5"/>
  <!-- headstock -->
  <rect x="26" y="13" width="8" height="7" rx="2" fill="#b8924a" stroke="#8b6914" stroke-width="1.5"/>
  <!-- strings -->
  <line x1="30" y1="20" x2="30" y2="50" stroke="#8b6914" stroke-width="0.8" opacity="0.6"/>
  <line x1="28.5" y1="20" x2="28.5" y2="50" stroke="#8b6914" stroke-width="0.8" opacity="0.6"/>
  <line x1="31.5" y1="20" x2="31.5" y2="50" stroke="#8b6914" stroke-width="0.8" opacity="0.6"/>
  <!-- music note -->
  <text x="42" y="28" font-size="14" fill="#6c4ab6" font-family="serif">♪</text>
</svg>
