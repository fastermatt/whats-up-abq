<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <circle cx="32" cy="32" r="28" fill="#eef7ee"/>
  <circle cx="32" cy="32" r="28" fill="none" stroke="#3a7d3a" stroke-width="3"/>
  <!-- main cactus body -->
  <rect x="28" y="20" width="8" height="28" rx="4" fill="#5aaa5a" stroke="#3a7d3a" stroke-width="1.5"/>
  <!-- left arm -->
  <rect x="18" y="28" width="12" height="6" rx="3" fill="#5aaa5a" stroke="#3a7d3a" stroke-width="1.5"/>
  <rect x="18" y="22" width="6" height="12" rx="3" fill="#5aaa5a" stroke="#3a7d3a" stroke-width="1.5"/>
  <!-- right arm -->
  <rect x="34" y="32" width="12" height="6" rx="3" fill="#5aaa5a" stroke="#3a7d3a" stroke-width="1.5"/>
  <rect x="40" y="26" width="6" height="12" rx="3" fill="#5aaa5a" stroke="#3a7d3a" stroke-width="1.5"/>
  <!-- ground -->
  <line x1="20" y1="48" x2="44" y2="48" stroke="#3a7d3a" stroke-width="2" stroke-linecap="round"/>
</svg>
