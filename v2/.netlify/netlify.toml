headersOrigin = "inline"
redirectsOrigin = "inline"

[images]
remote_images = ["^(?:https:\\/\\/cdn\\.abqunplugged\\.com(?:\\/(?!\\.)(?:(?:(?!(?:^|\\/)\\.).)*?)|$))$", "^(?:https:\\/\\/(?!\\.)(?=.)[^/]*?\\.r2\\.cloudflarestorage\\.com(?:\\/(?!\\.)(?:(?:(?!(?:^|\\/)\\.).)*?)|$))$"]

[functions]

[functions."*"]

[[plugins]]
origin = "config"
package = "@netlify/plugin-nextjs"

[plugins.inputs]

[build]
publish = ".next"
command = "npm run build"

[build.environment]
NODE_VERSION = "22"
NPM_FLAGS = "--legacy-peer-deps"

[build.processing]

[build.processing.css]

[build.processing.html]

[build.processing.images]

[build.processing.js]

[build.services]

[[headers]]
for = "/events/*"

[headers.values]
Cache-Control = "public, s-maxage=3600, stale-while-revalidate=86400"

[[headers]]
for = "/events"

[headers.values]
Cache-Control = "public, s-maxage=60, stale-while-revalidate=3600"

[[headers]]
for = "/categories/*"

[headers.values]
Cache-Control = "public, s-maxage=3600, stale-while-revalidate=86400"

[[headers]]
for = "/venues/*"

[headers.values]
Cache-Control = "public, s-maxage=3600, stale-while-revalidate=86400"

[[headers]]
for = "/neighborhoods/*"

[headers.values]
Cache-Control = "public, s-maxage=3600, stale-while-revalidate=86400"

[[headers]]
for = "/"

[headers.values]
Cache-Control = "public, s-maxage=60, stale-while-revalidate=600"

[[headers]]
for = "/admin/*"

[headers.values]
Cache-Control = "private, no-store"

[[headers]]
for = "/api/*"

[headers.values]
Cache-Control = "private, no-store"

[[headers]]
for = "/_next/static/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
from = "/_next/image"
to = "/.netlify/images?url=:url&w=:width&q=:quality"
status = 200.0
force = false

[redirects.query]
url = ":url"
w = ":width"
q = ":quality"

[redirects.conditions]

[redirects.headers]

[[redirects]]
from = "/_ipx/*"
to = "/.netlify/images?url=:url&w=:width&q=:quality"
status = 200.0
force = false

[redirects.query]
url = ":url"
w = ":width"
q = ":quality"

[redirects.conditions]

[redirects.headers]