[build]
  command = "npm install --legacy-peer-deps && npm run build"
  publish = ".next"

# ─── Netlify Image CDN — allowed remote domains ────────────────────────────────
# Supabase Storage (event photos uploaded/cached by the ingest pipeline) and
# Eventbrite's CDN are NOT in the proxy list (EventImage routes them through
# Netlify Image CDN for AVIF conversion). Without this, Netlify returns 400.
[images]
  # Allowlist for Netlify Image CDN — adds AVIF/WebP conversion + resize for
  # any external image URL passed through /.netlify/images?url=...
  remote_images = [
    "https://bsmvfutebmbkjvlrhiyq.supabase.co/*",
    "https://img.evbuc.com/*",
    "https://images.universe.com/*",
    "https://imagedelivery.net/*",
    "https://cdn.abqunplugged.com/*",
    # Ticketmaster + SeatGeek CDNs — direct browser fetches USED to get a
    # 403 hotlink-block, so events were routed through /api/image-proxy.
    # That serves originals (no AVIF, no resize) at ~510 KB each, making
    # them the LCP bottleneck. Direct fetches now succeed; let Netlify
    # CDN handle them so cards get a proper 30 KB AVIF instead.
    "https://s1.ticketm.net/*",
    "https://media.ticketmaster.com/*",
    "https://seatgeekimages.com/*",
    # Freedom Celebration (lovenm.org partner event) — hosted on its own domain
    "https://freedomabq.com/*",
  ]

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS    = "--legacy-peer-deps"

[functions]
  directory = "netlify/functions"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ─── Cache Headers ─────────────────────────────────────────────────────────────
# Event detail and listing pages: cache 1h on CDN, serve stale for 24h
[[headers]]
  for = "/events/*"
  [headers.values]
    Cache-Control = "public, s-maxage=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/events"
  [headers.values]
    Cache-Control = "public, s-maxage=60, stale-while-revalidate=3600"

[[headers]]
  for = "/categories/*"
  [headers.values]
    Cache-Control = "public, s-maxage=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/venues/*"
  [headers.values]
    Cache-Control = "public, s-maxage=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/neighborhoods/*"
  [headers.values]
    Cache-Control = "public, s-maxage=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, s-maxage=300, stale-while-revalidate=86400"

# Service worker — never cache aggressively. Browsers re-fetch sw.js on every
# page load to detect updates; if we let the CDN cache it for hours, users
# get stuck on stale SWs and never receive bugfixes. max-age=0 + must-revalidate
# is the standard pattern.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

# Next.js build output — fingerprinted filenames, safe to cache forever
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static assets — long-lived immutable cache (SVGs, PNGs, fonts, manifest)
# Next.js fingerprints /_next/static/* automatically; these cover /public assets
[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Admin pages must never be cached
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "private, no-store"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "private, no-store"
