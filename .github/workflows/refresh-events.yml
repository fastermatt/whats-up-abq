name: Refresh Event & Places Data (LEGACY V1 — MANUAL ONLY)

# 2026-04-19: Daily cron schedule DISABLED. This workflow ran V1 importers
# (fetch-data.cjs, fetch-local-events.cjs) which wrote to public.events using
# old formats that could clobber V2 ingestion. V1 is retired — the V2 weekly
# pipeline (v2-weekly-refresh.yml) is the source of truth now.
#
# This workflow is kept available for manual trigger only in case someone
# needs the legacy Google Places place-photos refresh. Don't re-enable the
# schedule without auditing what the .cjs scripts actually write.

on:
  # Manual trigger only — previously ran daily at 4 AM MT
  workflow_dispatch:
    inputs:
      skip_places:
        description: 'Skip Google Places refresh (faster, events only)'
        required: false
        default: 'false'
        type: boolean

jobs:
  refresh-data:
    name: Fetch fresh events & places
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Use a PAT so the push can trigger Netlify's deploy webhook
          token: ${{ secrets.GH_PAT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Fetch events from all sources & Google Places
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}
          SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
          BANDSINTOWN_APP_ID: ${{ secrets.BANDSINTOWN_APP_ID }}
          MEETUP_API_KEY: ${{ secrets.MEETUP_API_KEY }}
          SKIP_PLACES: 'true'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/fetch-data.cjs

      - name: Fetch local ABQ events (Do505, City calendar, UNM, BioPark)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/fetch-local-events.cjs


      - name: Purge past events from Supabase
        run: |
          node -e "const {createClient}=require('@supabase/supabase-js');const sb=createClient(process.env.SUPABASE_URL,process.env.SUPABASE_SERVICE_ROLE_KEY);sb.rpc('purge_past_events').then(({data,error})=>{if(error){console.error('Purge error:',error.message);process.exit(1);}console.log('Purged',data,'past events from Supabase');});"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Extra hygiene: hide past events, V1 sg- duplicate rows, and TM cancelled.
      # Runs after the V1 importer re-imports so it catches the duplicate writes.
      - name: V2 event cleanup (past / dupes / cancelled)
        working-directory: v2
        run: |
          npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          node scripts/cleanup-events.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Check for data changes
        id: diff
        run: |
          git diff --stat public/data/ || true
          CHANGED=$(git diff --name-only public/data/ | wc -l)
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Commit & push updated data
        if: steps.diff.outputs.changed != '0'
        run: |
          git config user.name "ABQ Unplugged Bot"
          git config user.email "bot@abq-unplugged.app"
          git add public/data/ticketmaster-events.json \
                  public/data/eventbrite-events.json \
                  public/data/seatgeek-events.json \
                  public/data/bandsintown-events.json \
                  public/data/meetup-events.json \
                  public/data/local-events.json \
                  public/data/google-places.json
          COUNT=$(node -e "
            const files = [
              './public/data/ticketmaster-events.json',
              './public/data/eventbrite-events.json',
              './public/data/seatgeek-events.json',
              './public/data/bandsintown-events.json',
              './public/data/meetup-events.json',
              './public/data/local-events.json',
            ];
            try {
              const total = files.reduce((s,f) => {
                try { return s + (require(f).length||0); } catch { return s; }
              }, 0);
              console.log(total);
            } catch { console.log('?'); }
          ")
          DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          git commit -m "data: refresh events & places — ${COUNT} events as of ${DATE}"
          git push

      - name: No changes detected
        if: steps.diff.outputs.changed == '0'
        run: echo "Data is already up to date — no commit needed."

      - name: Summary
        if: always()
        run: |
          echo "### Data Refresh Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cnt() { node -e "try{console.log(require('$1').length)}catch{console.log(0)}"; }
          TM=$(cnt ./public/data/ticketmaster-events.json)
          EB=$(cnt ./public/data/eventbrite-events.json)
          SG=$(cnt ./public/data/seatgeek-events.json)
          BIT=$(cnt ./public/data/bandsintown-events.json)
          MU=$(cnt ./public/data/meetup-events.json)
          LC=$(cnt ./public/data/local-events.json)
          TOTAL=$((TM + EB + SG + BIT + MU + LC))
          echo "| Source | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Ticketmaster | $TM |" >> $GITHUB_STEP_SUMMARY
          echo "| Eventbrite | $EB |" >> $GITHUB_STEP_SUMMARY
          echo "| SeatGeek | $SG |" >> $GITHUB_STEP_SUMMARY
          echo "| Bandsintown | $BIT |" >> $GITHUB_STEP_SUMMARY
          echo "| Meetup | $MU |" >> $GITHUB_STEP_SUMMARY
          echo "| Do505 + local iCal | $LC |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total events** | **$TOTAL** |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Run at: $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
