name: Daily Digest Email

# Runs send-digest.mjs each morning. Only sends to users whose digest_day matches
# today's weekday AND whose last_sent_at is > 6 days ago (throttle prevents
# accidental same-day re-sends).

on:
  schedule:
    - cron: '30 14 * * *'   # Every day at 7:30 AM MT (14:30 UTC)
  workflow_dispatch:
    inputs:
      user:
        description: 'Only send for this user UUID (leave blank for all)'
        required: false
        default: ''
        type: string
      force_day:
        description: 'Ignore digest_day-matches-today filter'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Preview without actually sending or updating state'
        required: false
        default: false
        type: boolean

jobs:
  digest:
    name: Send daily digest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RESEND_API_KEY:            ${{ secrets.RESEND_API_KEY }}
      DIGEST_FROM:               ${{ secrets.DIGEST_FROM }}
      SITE_URL:                  https://abqunplugged.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: v2/package-lock.json

      - name: Install v2 deps
        working-directory: v2
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Send digest
        working-directory: v2
        run: |
          ARGS=""
          if [ -n "${{ inputs.user }}" ];     then ARGS="$ARGS --user=${{ inputs.user }}"; fi
          if [ "${{ inputs.force_day }}" = "true" ]; then ARGS="$ARGS --force-day"; fi
          if [ "${{ inputs.dry_run }}" = "true" ];   then ARGS="$ARGS --dry-run"; fi
          node scripts/send-digest.mjs $ARGS
