name: Instagram Friday roundup

on:
  schedule:
    - cron: '23 15 * * 5'
      timezone: America/Denver
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abq-supabase-writers
  cancel-in-progress: false

jobs:
  ig-autopost:
    if: github.event_name == 'workflow_dispatch' || github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Prepare the Friday roundup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          IG_BASE_URL: https://abq-unplugged-v2.netlify.app
          IG_AUTOPOST_ENABLED: 'true' # The workflow's enabled state is the schedule switch.
          IG_RUN_EVENT: ${{ github.event_name }}
        run: |
          if [ "$IG_RUN_EVENT" = "schedule" ]; then
            node scripts/ig-autopost.mjs --friday-roundup
          else
            node scripts/ig-autopost.mjs --friday-roundup --dry-run
          fi

      - name: Save manual preview
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ig-friday-roundup-preview
          path: /tmp/ig-autopost/*.png
          if-no-files-found: error
