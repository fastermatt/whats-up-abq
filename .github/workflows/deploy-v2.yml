name: CI — deploy + smoke tests

# Build, deploy to Netlify, then run smoke tests.
# Uses netlify-cli@25.6.2 (last stable before 26.x which broke personal-token
# auth via mandatory Extensions API call returning 403). After deploy we poll
# the Netlify API until state=ready before running smoke tests.
#
# 25.6.2 itself still calls the /extensions and /blobs APIs during build —
# both are intermittently flaky on the Netlify side (clustered 401/403 errors
# observed 2026-05-09 with ~40% failure rate over a 30-min window). The deploy
# step below retries up to 3x on those specific infrastructure errors.

on:
  push:
    branches: [v2]
    paths:
      - 'v2/**'
      - '.github/workflows/deploy-v2.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://bsmvfutebmbkjvlrhiyq.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET_NAME: abq-unplugged-images
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_CDN_BASE_URL: https://cdn.abqunplugged.com
      TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
      SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
      NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${{ secrets.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
      NEXT_PUBLIC_UMAMI_SRC: https://cloud.umami.is/script.js
      NEXT_PUBLIC_SITE_URL: https://abqunplugged.com
      NEXT_PUBLIC_SITE_NAME: ABQ Unplugged
      NOMINATIM_USER_AGENT: ${{ secrets.NOMINATIM_USER_AGENT }}
      BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── Install + Build ───────────────────────────────────────────────────────
      # Pin to 25.6.2 — last stable before 26.x which added an extensions
      # API call that returns 403 with personal access tokens.
      - name: Install Netlify CLI
        run: npm install -g netlify-cli@25.6.2

      - name: Remove root package-lock.json (avoid Turbopack lockfile confusion)
        run: rm -f package-lock.json

      - name: Install dependencies
        working-directory: v2
        run: npm install --legacy-peer-deps

      - name: Build Next.js app
        working-directory: v2
        run: npm run build

      # ── Deploy ────────────────────────────────────────────────────────────────
      # Use netlify link --id with the full UUID (not the short form from
      # NETLIFY_SITE_ID secret which may be truncated). The UUID is not a
      # secret — it identifies the project but grants no access without a token.
      - name: Link Netlify site
        working-directory: v2
        run: |
          netlify link --id a0ff66c2-b959-4438-b184-509597d248e2

      # Retry the deploy step on transient Netlify infrastructure errors. Today
      # (2026-05-09) we saw a 40% failure rate from intermittent 401/403 responses
      # on Netlify's /extensions and /blobs endpoints, which @netlify/build calls
      # synchronously with no retry. The errors are cluster-correlated (Netlify-side
      # flakiness, not our token) and resolve on a re-run within seconds. Retry up
      # to 3 times with exponential backoff (15s, 45s) before failing the job.
      - name: Deploy to Netlify
        working-directory: v2
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "::group::Deploy attempt $attempt of 3"
            netlify deploy \
              --auth "$NETLIFY_AUTH_TOKEN" \
              --dir .next \
              --functions .netlify/functions-internal \
              --prod \
              --message "Deploy ${{ github.sha }}" \
              2>&1 | tee /tmp/deploy-output.log
            EXIT_CODE=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ "$EXIT_CODE" -eq 0 ]; then
              echo "Deploy succeeded on attempt $attempt"
              exit 0
            fi
            # Only retry on transient Netlify infrastructure errors. Real build
            # errors (TypeScript, missing modules, plugin crashes from our code)
            # should fail fast.
            if grep -qE "Failed retrieving extensions|Netlify Blobs has generated|Unexpected status code (401|403|429|500|502|503|504)|fetch failed|ECONNRESET|ETIMEDOUT" /tmp/deploy-output.log; then
              if [ "$attempt" -lt 3 ]; then
                BACKOFF=$((attempt * 30))
                echo "::warning::Transient Netlify error on attempt $attempt — retrying in ${BACKOFF}s"
                sleep $BACKOFF
                continue
              fi
              echo "::error::Deploy failed after 3 attempts due to transient Netlify error"
              exit 1
            fi
            echo "::error::Deploy failed with non-retryable error"
            exit "$EXIT_CODE"
          done
          exit 1

      # ── Wait for Netlify to mark deploy as ready ──────────────────────────────
      # Netlify sets commit_ref=null on CLI deploys; the SHA appears in .title
      # as "Deploy {full-sha}". Poll until state=ready (or error) before tests.
      # On workflow_dispatch skip the wait — just smoke-test whatever is live.
      - name: Wait for deploy to go live (${{ github.sha }})
        if: github.event_name == 'push'
        run: |
          SHA="${{ github.sha }}"
          echo "Polling Netlify for 'Deploy ${SHA:0:7}' to reach ready..."
          for i in $(seq 1 20); do
            RESPONSE=$(curl -sf \
              -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
              "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/deploys?per_page=10") || {
              echo "  Netlify API unreachable, retrying in 15s..."
              sleep 15
              continue
            }
            STATE=$(echo "$RESPONSE" | jq -r \
              --arg sha "$SHA" \
              '[.[] | select(.commit_ref == $sha or .title == ("Deploy " + $sha))] | first | .state // "not_found"')
            echo "  [$i/20] state=$STATE"
            case "$STATE" in
              ready)
                echo "✅ Deploy is live!"
                break
                ;;
              error)
                echo "❌ Netlify reported deploy error for $SHA"
                exit 1
                ;;
              not_found|null)
                echo "  Deploy not indexed yet — waiting 15s..."
                ;;
              *)
                echo "  Deploy in state '$STATE' — waiting 15s..."
                ;;
            esac
            sleep 15
          done

      # ── Post-deploy smoke tests ───────────────────────────────────────────────
      - name: Post-deploy smoke tests
        working-directory: v2
        env:
          SUPABASE_URL: https://bsmvfutebmbkjvlrhiyq.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          echo "Running live URL smoke tests against https://abqunplugged.com..."
          node scripts/regression-tests.mjs --site=https://abqunplugged.com --tag=live || {
            echo "::warning::Post-deploy smoke tests failed — middleware or routing regression"
            exit 0
          }

      # ── On failure: open a GitHub Issue ──────────────────────────────────────
      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'ci-failure',
              state: 'open',
            });
            const title = `🚨 CI failed: ${context.workflow}`;
            const existing = issues.find(i => i.title === title);
            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: [
                  `**Workflow:** ${context.workflow}`,
                  `**Branch:** \`${context.ref.replace('refs/heads/', '')}\``,
                  `**Commit:** \`${context.sha.slice(0, 7)}\` — ${context.payload.head_commit?.message?.split('\n')[0] || ''}`,
                  `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                  ``,
                  `Claude will investigate at next session start. Close this issue once fixed.`,
                ].join('\n'),
                labels: ['ci-failure'],
              });
            }
