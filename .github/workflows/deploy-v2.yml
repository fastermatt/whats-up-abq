name: Deploy v2 to Netlify

on:
  push:
    branches: [v2]
    paths:
      - 'v2/**'
      - '.github/workflows/deploy-v2.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    # ── Env vars at job level so ALL steps (build + deploy) have them ──────────
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://bsmvfutebmbkjvlrhiyq.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET_NAME: abq-unplugged-images
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_CDN_BASE_URL: https://cdn.abqunplugged.com
      TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
      SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
      NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${{ secrets.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
      NEXT_PUBLIC_UMAMI_SRC: https://cloud.umami.is/script.js
      NEXT_PUBLIC_SITE_URL: https://abqunplugged.com
      NEXT_PUBLIC_SITE_NAME: ABQ Unplugged
      NOMINATIM_USER_AGENT: ${{ secrets.NOMINATIM_USER_AGENT }}
      BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Remove root package-lock.json (avoid Turbopack lockfile confusion)
        run: rm -f package-lock.json

      - name: Install dependencies
        working-directory: v2
        run: npm install --legacy-peer-deps

      - name: Build Next.js app
        working-directory: v2
        run: npm run build

      - name: Deploy to Netlify
        working-directory: v2
        run: |
          netlify deploy \
            --site $NETLIFY_SITE_ID \
            --auth $NETLIFY_AUTH_TOKEN \
            --dir .next \
            --functions .netlify/functions-internal \
            --prod \
            --message "Deploy ${{ github.sha }}"

      # ── Post-deploy smoke tests — verify critical URL-level redirects ──────────
      # These tests catch regressions in middleware (category slugs, venue slugs,
      # /search redirect, etc.) — the things that broke this session and would
      # have been silently shipped without a smoke test.
      # We sleep first so Netlify has time to clear edge cache and propagate.
      - name: Wait for deploy to propagate
        run: sleep 30

      - name: Post-deploy smoke tests
        working-directory: v2
        env:
          SUPABASE_URL: https://bsmvfutebmbkjvlrhiyq.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          echo "Running live URL smoke tests..."
          # Only run the live (URL-hitting) tests — data-shape tests run on schedule
          node scripts/regression-tests.mjs --site=https://abqunplugged.com --tag=live || {
            echo "::warning::Post-deploy smoke tests failed — middleware or routing regression"
            echo "smoke_failed=true" >> $GITHUB_ENV
            # Don't fail the deploy itself — but flag it so we know to investigate
            exit 0
          }

      # ── On failure: open a GitHub Issue instead of emailing Matt ──────────────
      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'ci-failure',
              state: 'open',
            });
            // Don't duplicate — skip if an open issue already exists for this workflow
            const title = `🚨 CI failed: ${context.workflow}`;
            const existing = issues.find(i => i.title === title);
            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: [
                  `**Workflow:** ${context.workflow}`,
                  `**Branch:** \`${context.ref.replace('refs/heads/', '')}\``,
                  `**Commit:** \`${context.sha.slice(0, 7)}\` — ${context.payload.head_commit?.message?.split('\n')[0] || ''}`,
                  `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                  ``,
                  `Claude will investigate at next session start. Close this issue once fixed.`,
                ].join('\n'),
                labels: ['ci-failure'],
              });
            }
