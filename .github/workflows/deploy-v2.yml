name: CI — smoke tests after Netlify deploy

# Netlify's GitHub App auto-deploys every push to `v2` independently.
# This workflow's job is to wait for that deploy, then run smoke tests.
# We no longer run netlify-cli here — it calls the Extensions API which
# returns 403 for personal access tokens (netlify-cli ≥25.x regression).

on:
  push:
    branches: [v2]
    paths:
      - 'v2/**'
      - '.github/workflows/deploy-v2.yml'
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    env:
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── Wait for Netlify's own build pipeline to finish ──────────────────────
      # Netlify's GitHub App watches the v2 branch and builds/deploys on every
      # push. We poll the Netlify Deploys API until we see the deploy for this
      # exact commit SHA in state=ready (or error out on failure).
      # On workflow_dispatch we skip this — just smoke-test whatever is live.
      - name: Wait for Netlify deploy (${{ github.sha }})
        if: github.event_name == 'push'
        run: |
          SHA="${{ github.sha }}"
          echo "Polling Netlify for deploy of commit ${SHA:0:7}..."
          for i in $(seq 1 40); do
            RESPONSE=$(curl -sf \
              -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
              "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/deploys?per_page=20") || {
              echo "  Netlify API unreachable, retrying in 15s..."
              sleep 15
              continue
            }
            # Netlify sets commit_ref=null for GitHub App deploys;
            # the commit SHA is embedded in .title as "Deploy {sha}".
            # We match on both fields for resilience.
            STATE=$(echo "$RESPONSE" | jq -r \
              --arg sha "$SHA" \
              '[.[] | select(.commit_ref == $sha or .title == ("Deploy " + $sha))] | first | .state // "not_found"')
            echo "  [$i/40] state=$STATE"
            case "$STATE" in
              ready)
                echo "✅ Deploy is live!"
                exit 0
                ;;
              error)
                echo "❌ Netlify build failed for $SHA"
                exit 1
                ;;
              not_found|null)
                echo "  Deploy not yet queued — waiting 30s..."
                ;;
              *)
                echo "  Build in progress ($STATE) — waiting 30s..."
                ;;
            esac
            sleep 30
          done
          echo "⏰ Timed out waiting for Netlify deploy (20 min)"
          exit 1

      # ── Post-deploy smoke tests — verify critical URL-level redirects ────────
      # These tests catch regressions in middleware (category slugs, venue slugs,
      # /search redirect, etc.). We install only what the test script needs
      # (--ignore-scripts skips postinstall hooks to keep this fast).
      - name: Install test dependencies
        working-directory: v2
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Post-deploy smoke tests
        working-directory: v2
        env:
          SUPABASE_URL: https://bsmvfutebmbkjvlrhiyq.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          echo "Running live URL smoke tests against https://abqunplugged.com..."
          node scripts/regression-tests.mjs --site=https://abqunplugged.com --tag=live || {
            echo "::warning::Post-deploy smoke tests failed — middleware or routing regression"
            # Don't fail the workflow — but the warning flags it for investigation
            exit 0
          }

      # ── On failure: open a GitHub Issue ─────────────────────────────────────
      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'ci-failure',
              state: 'open',
            });
            const title = `🚨 CI failed: ${context.workflow}`;
            const existing = issues.find(i => i.title === title);
            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: [
                  `**Workflow:** ${context.workflow}`,
                  `**Branch:** \`${context.ref.replace('refs/heads/', '')}\``,
                  `**Commit:** \`${context.sha.slice(0, 7)}\` — ${context.payload.head_commit?.message?.split('\n')[0] || ''}`,
                  `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                  ``,
                  `Claude will investigate at next session start. Close this issue once fixed.`,
                ].join('\n'),
                labels: ['ci-failure'],
              });
            }
