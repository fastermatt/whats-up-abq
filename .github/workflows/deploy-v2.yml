name: Deploy v2 to Netlify

on:
  push:
    branches: [v2]
    paths:
      - 'v2/**'
      - '.github/workflows/deploy-v2.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Remove root package-lock.json (avoid Turbopack lockfile confusion)
        run: rm -f package-lock.json

      - name: Deploy to Netlify (builds on Netlify infra via CLI)
        working-directory: v2
        run: |
          netlify deploy \
            --site $NETLIFY_SITE_ID \
            --auth $NETLIFY_AUTH_TOKEN \
            --build \
            --prod \
            --message "Deploy ${{ github.sha }}"
        env:
          NETLIFY_SITE_ID: a0ff66c2-b959-4438-b184-509597d248e2
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          # Build-time env vars (Netlify site env vars are also injected automatically)
          NEXT_PUBLIC_SUPABASE_URL: https://bsmvfutebmbkjvlrhiyq.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET_NAME: abq-unplugged-images
          CLOUDFLARE_ACCOUNT_ID: 6cb41f07a6895b9a25ff68394eed3980
          NEXT_PUBLIC_CDN_BASE_URL: https://cdn.abqunplugged.com
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
          NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${{ secrets.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
          NEXT_PUBLIC_UMAMI_SRC: https://cloud.umami.is/script.js
          NEXT_PUBLIC_SITE_URL: https://v2.abqunplugged.com
          NEXT_PUBLIC_SITE_NAME: ABQ Unplugged
          NOMINATIM_USER_AGENT: abqunplugged/2.0 (4mattcarlson@gmail.com)
