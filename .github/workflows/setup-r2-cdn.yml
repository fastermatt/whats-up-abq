name: Setup R2 Custom Domain (cdn.abqunplugged.com)

# One-time workflow to add cdn.abqunplugged.com as a custom domain
# to the abq-unplugged-images R2 bucket. Cloudflare will auto-create
# the CNAME record in the abqunplugged.com DNS zone.
#
# Run this ONCE from GitHub Actions → workflow_dispatch.
# After it succeeds, cdn.abqunplugged.com will resolve and the
# cache-images.yml workflow can safely be used again.

on:
  workflow_dispatch:

jobs:
  setup-cdn:
    name: Add cdn.abqunplugged.com to R2 bucket
    runs-on: ubuntu-latest
    steps:
      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Add custom domain to R2 bucket
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Looking up zone ID for abqunplugged.com..."
          ZONE_ID=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=abqunplugged.com" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | \
            python3 -c "import json,sys; d=json.load(sys.stdin); print(d['result'][0]['id'])")
          echo "Zone ID: $ZONE_ID"

          echo "Adding cdn.abqunplugged.com as custom domain to abq-unplugged-images..."
          wrangler r2 bucket domain add abq-unplugged-images \
            --domain cdn.abqunplugged.com \
            --zone-id "$ZONE_ID"
          echo "✅ Done. DNS propagation may take a few minutes."

      - name: Verify DNS resolves
        run: |
          echo "Waiting 45s for DNS propagation..."
          sleep 45
          echo "Testing cdn.abqunplugged.com..."
          curl -sI "https://cdn.abqunplugged.com/lovenm-national-day-of-prayer-2026.jpg" | head -3 || echo "Still propagating — check again in a few minutes."
