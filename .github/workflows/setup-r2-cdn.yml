name: Enable R2 Public Access (get r2.dev URL)

# One-time workflow: enables public r2.dev URL on the abq-unplugged-images
# bucket. After this runs, images are available at:
#   https://pub-{hash}.r2.dev/{event-id}.jpg
#
# The r2.dev URL is then used as CDN_BASE in cache-local-images.mjs.
# Run once, copy the pub-{hash}.r2.dev URL from the job output,
# and update CDN_BASE in v2/scripts/cache-local-images.mjs.

on:
  workflow_dispatch:

jobs:
  enable-r2-public:
    name: Enable R2 public bucket access
    runs-on: ubuntu-latest
    steps:
      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Enable r2.dev subdomain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Enabling r2.dev public URL for abq-unplugged-images..."
          wrangler r2 bucket dev-url enable abq-unplugged-images

      - name: Get the public r2.dev URL
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Fetching bucket info..."
          RESULT=$(curl -s \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/abq-unplugged-images" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          echo "Bucket details:"
          echo "$RESULT" | python3 -m json.tool

          DEV_URL=$(echo "$RESULT" | python3 -c "
import json,sys
d=json.load(sys.stdin)
bucket=d.get('result',{})
# Try various fields where r2.dev URL might appear
for k in ['dev_url','bucketId','bucket_id','public_url']:
  if k in bucket:
    print(f'{k}: {bucket[k]}')
print('Full result keys:', list(bucket.keys()))
" 2>/dev/null || echo "Could not parse")
          echo "$DEV_URL"
          echo ""
          echo "=== Next step ==="
          echo "Copy the pub-*.r2.dev URL from above."
          echo "Update CDN_BASE in v2/scripts/cache-local-images.mjs to use it."
          echo "Then run cache-images.yml to repopulate the CDN."
