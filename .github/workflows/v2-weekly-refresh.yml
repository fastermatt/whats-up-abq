name: V2 Weekly Event Refresh

on:
  schedule:
    - cron: '0 17 * * 2' # Tuesday 10 AM MST / 11 AM MDT
  workflow_dispatch:
    inputs:
      snapshot_only:
        description: Build from the current catalog without re-running imports
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: abq-supabase-writers
  cancel-in-progress: false

jobs:
  weekly:
    name: Refresh and build static calendar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - name: Install locked dependencies
        working-directory: v2
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Refresh event feeds without model calls
        if: github.event_name == 'schedule' || !inputs.snapshot_only
        working-directory: v2
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          SEATGEEK_AID: ${{ secrets.SEATGEEK_AID }}
          EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}
        run: |
          set -euo pipefail
          for source in ticketmaster seatgeek eventbrite nhcc; do
            timeout 180s node "scripts/import-$source.mjs"
          done
          timeout 720s node scripts/scrape-abqtodo.mjs --api-only || echo "::warning::ABQtodo community feed did not complete."
          timeout 180s node scripts/scrape-amp-concerts.mjs || echo "::warning::AMP community feed did not complete."
          timeout 90s node scripts/cleanup-events.mjs --skip-purge
          timeout 90s node scripts/dedup-events.mjs --limit=100

      - name: Build and verify the public snapshot
        env:
          ABQ_PUBLIC_KEY: ${{ vars.ABQ_PUBLIC_KEY }}
        run: |
          node --test static-site/calendar.test.mjs
          npm exec --yes --package=tsx@4.23.15 -- tsx --tsconfig v2/tsconfig.json static-site/build.mjs
          node static-site/verify.mjs

      - name: Save deployable files
        uses: actions/upload-artifact@v4
        with:
          name: abq-static-site
          path: static-site/dist/
          retention-days: 14

  publish:
    name: Publish to Cloudflare Pages
    if: vars.ABQ_STATIC_PUBLISH_ENABLED == 'true' && github.ref == 'refs/heads/v2'
    needs: weekly
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: abq-cloudflare-production
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: abq-static-site
          path: dist
      - name: Upload verified files to the Pages production branch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare Pages deployment credentials are missing."
            exit 1
          fi
          npm exec --yes --package=wrangler@4.157.0 -- wrangler pages deploy dist --project-name=abq-unplugged-static --branch=main
      - name: Verify the deployed catalog
        run: |
          origin=https://abq-unplugged-static.pages.dev
          curl -fsS --retry 5 --retry-all-errors --max-time 15 "$origin/catalog.json?build=$GITHUB_RUN_ID" -o live-catalog.json
          cmp dist/catalog.json live-catalog.json
          for path in / /events/ /tonight/ /weekend/ /free/ /sitemap.xml; do
            curl -fsS --max-time 15 "$origin$path" -o /dev/null
          done
