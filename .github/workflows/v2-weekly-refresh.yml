name: V2 Weekly Event Refresh

# Single-command foolproof pipeline. All the logic lives in
# v2/scripts/ingest.mjs — imports, enrichment, category backfill, cleanup,
# invariant checks, smoke tests, auto-reject of bad shared-image URLs.
# Exit code 0 = site healthy, non-zero = something needs fixing.

on:
  # Cron PAUSED 2026-04-20 — re-enable by uncommenting the schedule block below
  # schedule:
  #   - cron: '0 14 * * 2'   # Every Tuesday 7 AM MT

  # Manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      only:
        description: 'Run only one source (tm|sg|eb|nhcc) — leave blank for all'
        required: false
        default: ''
        type: string
      skip_imports:
        description: 'Skip imports, only run enrichment + validation'
        required: false
        default: false
        type: boolean
      smoke_only:
        description: 'Only run smoke tests (no imports, no enrichment)'
        required: false
        default: false
        type: boolean

jobs:
  ingest:
    name: Foolproof Ingest Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TICKETMASTER_API_KEY:      ${{ secrets.TICKETMASTER_API_KEY }}
      SEATGEEK_AID:              ${{ secrets.SEATGEEK_AID }}
      EVENTBRITE_TOKEN:          ${{ secrets.EVENTBRITE_TOKEN }}
      DEEPSEEK_API_KEY:          ${{ secrets.DEEPSEEK_API_KEY }}
      ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: v2/package-lock.json

      - name: Install V2 dependencies
        working-directory: v2
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Run foolproof ingest pipeline
        id: ingest
        working-directory: v2
        run: |
          ARGS=""
          if [ -n "${{ inputs.only }}" ]; then ARGS="$ARGS --only=${{ inputs.only }}"; fi
          if [ "${{ inputs.skip_imports }}" = "true" ]; then ARGS="$ARGS --skip-imports"; fi
          if [ "${{ inputs.smoke_only }}" = "true" ]; then ARGS="$ARGS --smoke-only"; fi
          echo "Running: node scripts/ingest.mjs $ARGS"
          node scripts/ingest.mjs $ARGS

      - name: Write GitHub step summary
        if: always()
        run: |
          {
            echo "## 📅 V2 Ingest Pipeline"
            echo ""
            echo "**Run at:** $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "**Trigger:** ${{ github.event_name }}"
            echo "**Pipeline result:** ${{ steps.ingest.outcome }}"
            echo ""
            if [ "${{ steps.ingest.outcome }}" = "success" ]; then
              echo "✅ All gates and smoke tests passed. Site is healthy."
            else
              echo "❌ Pipeline failed. Check the ingest step logs above for specific failures."
              echo ""
              echo "Common causes:"
              echo "- Source API down or returning empty (check the failed source's logs)"
              echo "- Coverage gates dropped below threshold (category/image/neighborhood/mood)"
              echo "- Smoke tests caught invalid image/time/venue in a sampled event"
              echo "- Image-URL misassociation detected across 5+ unrelated events (auto-rejected)"
            fi
            echo ""
            echo "---"
            echo "Full playbook: memory/ingestion.md + memory/image_system.md"
          } >> $GITHUB_STEP_SUMMARY

      # ── On failure: open a GitHub Issue instead of emailing Matt ──────────────
      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'ci-failure',
              state: 'open',
            });
            const title = `🚨 CI failed: ${context.workflow}`;
            const existing = issues.find(i => i.title === title);
            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: [
                  `**Workflow:** ${context.workflow}`,
                  `**Trigger:** ${context.eventName}`,
                  `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                  ``,
                  `Claude will investigate at next session start. Close this issue once fixed.`,
                ].join('\n'),
                labels: ['ci-failure'],
              });
            }
