name: Nightly Notification Matcher

# Runs match-notifications.mjs every night so new users see "For You" matches
# within ~24h of saving preferences. Also refreshes scores after new events
# are imported during the Tuesday pipeline.

on:
  schedule:
    - cron: '0 12 * * *'   # Every day at 5 AM MT (12:00 UTC)
  workflow_dispatch:
    inputs:
      user:
        description: 'Only match for this user UUID (leave blank for all)'
        required: false
        default: ''
        type: string

jobs:
  match:
    name: Run notification matcher
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: v2/package-lock.json

      - name: Install v2 deps
        working-directory: v2
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Run matcher
        working-directory: v2
        run: |
          if [ -n "${{ inputs.user }}" ]; then
            node scripts/match-notifications.mjs --user=${{ inputs.user }}
          else
            node scripts/match-notifications.mjs
          fi
