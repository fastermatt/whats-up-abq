    <!-- ─── Fonts: loaded as <link> (not @import) to avoid Safari ITP cross-site warnings ─── -->
    <!-- Public Sans — Terracotta theme -->
    <!-- ─── Preload: LCP critical assets ─── -->

    <!-- ─── Critical CSS: hide Material Symbols until font loads (prevents FOUT) ─── -->
    <!-- Icons are invisible (not absent) during load — no layout shift, no text flash.    -->
    <!-- JS below uses Font Loading API to reveal them once ready, with 2.5s fallback.     -->
    <style>
      .material-symbols-outlined {
        font-family: 'Material Symbols Outlined', sans-serif;
        /* Hidden until .icons-ready is added to <html> by the script below */
        visibility: hidden;
        /* Keep the element in layout flow so nothing jumps when icons appear */
        display: inline-block;
        line-height: 1;
        vertical-align: middle;
      }
      .icons-ready .material-symbols-outlined {
        visibility: visible;
      }
    </style>
    <!-- Reveal icons as soon as the font is confirmed loaded (or after 2.5s fallback) -->
    <script>
      (function () {
        function revealIcons() {
          document.documentElement.classList.add('icons-ready');
        }
        if (typeof document.fonts !== 'undefined') {
          // Already cached? Reveal immediately.
          if (document.fonts.check('1em "Material Symbols Outlined"')) {
            revealIcons();
          } else {
            document.fonts.load('1em "Material Symbols Outlined"').then(revealIcons, revealIcons);
          }
        } else {
          // No Font Loading API (old browsers) — reveal straight away
          revealIcons();
        }
        // Safety net: always reveal after 2.5s so icons never stay invisible
        setTimeout(revealIcons, 2500);
      })();
    </script>

    <!-- ─── Service Worker registration ─── -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(reg => {
              console.log('[SW] Registered, scope:', reg.scope);
              reg.addEventListener('updatefound', () => {
                const newWorker = reg.installing;
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('[SW] New version available — will activate on next visit');
                  }
                });
              });
            })
            .catch(err => console.warn('[SW] Registration failed:', err));
        });
      }
    </script>
