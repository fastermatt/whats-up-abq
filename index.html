<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ─── Fonts: loaded as <link> (not @import) to avoid Safari ITP cross-site warnings ─── -->
    <!-- Public Sans — Terracotta theme -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <!-- ─── Viewport: viewport-fit=cover for iOS Dynamic Island / notch (Apple HIG) ─── -->
    <!-- NOTE: user-scalable removed — WCAG 1.4.4 requires pinch-zoom be available for low-vision users -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />

    <!-- ─── iOS PWA: Add to Home Screen support ─── -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent: status bar overlays our content so we can extend behind it with safe-area-inset-top -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ABQ Unplugged" />

    <!-- ─── Android / Chrome PWA ─── -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="ABQ Unplugged" />

    <!-- ─── Theme colour: matches app background / header (Terracotta theme) ─── -->
    <meta name="theme-color" content="#F9F5F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1C1814" media="(prefers-color-scheme: dark)" />

    <!-- ─── Description / social ─── -->
    <meta
      name="description"
      content="Explore events, places &amp; culture in Albuquerque. Check in, earn levels, and discover ABQ like never before."
    />

    <!-- ─── Open Graph (iMessage, WhatsApp, Slack, Twitter, Facebook) ─── -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://abqunplugged.com/" />
    <meta property="og:title"       content="ABQ Unplugged — Events, Places &amp; Culture in Albuquerque" />
    <meta property="og:description" content="Discover what's happening in the Duke City. 490+ events, 4,500+ places. Free, forever." />
    <meta property="og:image"       content="https://abqunplugged.com/og-image.jpg" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt"   content="ABQ Unplugged — Events, Places &amp; Culture in Albuquerque" />
    <meta property="og:locale"      content="en_US" />
    <meta property="og:site_name"   content="ABQ Unplugged" />

    <!-- ─── Twitter / X card ─── -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="ABQ Unplugged — Events &amp; Places in ABQ" />
    <meta name="twitter:description" content="Discover what's happening in the Duke City. 490+ events, 4,500+ places. Free." />
    <meta name="twitter:image"       content="https://abqunplugged.com/og-image.jpg" />

    <!-- ─── Favicon ─── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />

    <!-- ─── Apple touch icons (iOS HIG: 180×180 for iPhone, 167×167 for iPad) ─── -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152.png" />

    <!-- ─── PWA Web App Manifest ─── -->
    <link rel="manifest" href="/manifest.json" />

    <!-- ─── iOS Launch / Splash screens (iPhone 14 Pro and up) ─── -->
    <!-- Primary splash: 1179×2556 @3x (iPhone 15/16 Pro) -->
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)"
      href="/splash/splash-1179x2556.png"
    />
    <!-- iPhone 14/15 -->
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)"
      href="/splash/splash-1170x2532.png"
    />
    <!-- iPhone SE 3rd gen -->
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)"
      href="/splash/splash-750x1334.png"
    />

    <!-- iPhone 14 Pro Max / 15 Pro Max -->
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)"
      href="/splash/splash-1290x2796.png"
    />
    <!-- iPhone 14 Plus / 15 Plus -->
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)"
      href="/splash/splash-1284x2778.png"
    />
    <!-- iPad Mini 6th gen -->
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 744px) and (device-height: 1133px) and (-webkit-device-pixel-ratio: 2)"
      href="/splash/splash-1488x2266.png"
    />
    <!-- iPad 10th gen -->
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 810px) and (device-height: 1080px) and (-webkit-device-pixel-ratio: 2)"
      href="/splash/splash-1620x2160.png"
    />
    <!-- iPad Pro 12.9" -->
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2)"
      href="/splash/splash-2048x2732.png"
    />

    <title>ABQ Unplugged — Events, Places &amp; Culture in Albuquerque</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- ─── Service Worker registration ─── -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(reg => {
              console.log('[SW] Registered, scope:', reg.scope);
              // Check for updates on each page load
              reg.addEventListener('updatefound', () => {
                const newWorker = reg.installing;
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('[SW] New version available — will activate on next visit');
                  }
                });
              });
            })
            .catch(err => console.warn('[SW] Registration failed:', err));
        });
      }
    </script>
  </body>
</html>
