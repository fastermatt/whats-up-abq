    <!-- ─── Self-hosted Material Symbols font (fixes iOS Safari font loading failure) ─── -->
    <style>
      @font-face {
        font-family: 'Material Symbols Outlined';
        font-style: normal;
        font-weight: 100 700;
        font-display: block; /* block: invisible text while loading, never shows ligature text */
        src: url('/fonts/MaterialSymbolsOutlined.woff2') format('woff2');
      }
      .material-symbols-outlined {
        font-family: 'Material Symbols Outlined', sans-serif;
        font-weight: normal;
        font-style: normal;
        font-size: 24px;
        display: inline-block;
        line-height: 1;
        text-transform: none;
        letter-spacing: normal;
        word-wrap: normal;
        white-space: nowrap;
        direction: ltr;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        font-feature-settings: 'liga';
        /* Hidden until font loads — prevents showing raw ligature text */
        visibility: hidden;
      }
      .icons-ready .material-symbols-outlined {
        visibility: visible;
      }
    </style>
    <!-- Reveal icons once self-hosted font is confirmed loaded (or 3s fallback) -->
    <script>
      (function () {
        function revealIcons() {
          document.documentElement.classList.add('icons-ready');
        }
        if (typeof document.fonts !== 'undefined') {
          // Wait for self-hosted font to actually load
          document.fonts.ready.then(function() {
            if (document.fonts.check('24px "Material Symbols Outlined"')) {
              revealIcons();
            } else {
              // Font set is ready but our font isn't in it yet — try loading explicitly
              document.fonts.load('24px "Material Symbols Outlined"').then(revealIcons, revealIcons);
            }
          });
        } else {
          revealIcons();
        }
        // Safety net — but 3s to give self-hosted font more time
        setTimeout(revealIcons, 3000);
      })();
    </script>

    <!-- ─── Service Worker registration ─── -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(reg => {
              console.log('[SW] Registered, scope:', reg.scope);
              reg.addEventListener('updatefound', () => {
                const newWorker = reg.installing;
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('[SW] New version available — reloading now');
                    // Auto-reload so users always get the latest fix immediately
                    window.location.reload();
                  }
                });
              });
            })
            .catch(err => console.warn('[SW] Registration failed:', err));
          // Reload when a new SW takes control
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            window.location.reload();
          });
          // Also listen for SW_UPDATED message (sent by new SW on activate via client.navigate fallback)
          navigator.serviceWorker.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'SW_UPDATED') {
              window.location.reload();
            }
          });
        });
      }
    </script>
